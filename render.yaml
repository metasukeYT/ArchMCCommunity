services:
  - type: web
    name: archmc-discord-bot
    runtime: node
    plan: free
    rootDir: bot
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: CLIENT_ID
        value: "1569551679840591892"
      - key: ROLE_ID
        value: "1568130111243554868"
      - key: NODE_VERSION
        value: "20"
